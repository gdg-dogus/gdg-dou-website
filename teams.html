<!DOCTYPE html>
<html lang="tr" data-color-scheme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="meta.teamsTitle">Ekip Sayfası - GDG on Campus DOU</title>

    <!-- Preconnect for faster font loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">

    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/pages/team.css">
</head>
<body class="page-team">
    <div id="header-placeholder"></div>

    <main>
        <section class="hero team-hero section-team">
            <div class="hero-background">
                <div class="hero-orb orb-1"></div>
                <div class="hero-orb orb-2"></div>
                <div class="hero-orb orb-3"></div>
                <div class="hero-orb orb-4"></div>
                <div class="hero-grid-lines"></div>
            </div>
            <div class="container">
                <div class="section-header team-header">
                    <span class="hero-eyebrow" data-i18n="teamsPage.eyebrow">Topluluğumuzu Güçlendiren Kadro</span>
                    <h2 data-i18n="teamsPage.title">Ekibimizle Tanışın</h2>
                    <p class="team-subtitle" data-i18n="teamsPage.subtitle">Organizasyon, geliştirme, tasarım ve iletişim ekibimiz bir araya gelerek GDG on Campus DOU deneyimini oluşturuyor.</p>
                </div>

                <div class="team-grid"></div>

                <div id="teamModal" class="modal-overlay" aria-hidden="true">
                    <div class="modal-container">
                        <button class="modal-close" id="closeTeamModal" aria-label="Close" data-i18n-aria-label="common.actions.close">
                            <span class="material-symbols-outlined">close</span>
                        </button>
                        <div class="modal-content" id="teamModalContent"></div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <div id="footer-placeholder"></div>

    <script type="module" src="js/main.js"></script>
    <script type="module" src="js/renderers/teamRenderer.js"></script>
</body>
</html>
